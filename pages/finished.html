<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Your Pomodoro timer session has finished."
    />
    <meta name="theme-color" content="#000000" />
    <title>Finished | Pomodoro Timer</title>
    <link rel="stylesheet" href="../styles/finished.css" />
  </head>

  <body>
    <main class="pomodoro-finished">
      <section
        class="pomodoro-finished-section"
        aria-labelledby="finished-title"
      >
        <h1 class="pomodoro-finished-title animate-item" id="finished-title">
          TIME'S UP
        </h1>

        <a
          class="pomodoro-finished-button animate-item delay-2"
          href="../index.html"
        >
          BACK TO START
        </a>
      </section>
    </main>

    <script src="../script.js"></script>
  </body>
</html>
